<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Studio Admin | Pheonix</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/Sortable/1.15.0/Sortable.min.js"></script>
    <style>
        /* Circular Color Picker Styling from your old version */
        #color-circle {
            width: 150px;
            height: 150px;
            border-radius: 50%;
            border: none;
            cursor: pointer;
            padding: 0;
            overflow: hidden;
        }
        #color-circle::-webkit-color-swatch-wrapper { padding: 0; }
        #color-circle::-webkit-color-swatch { border: none; border-radius: 50%; }
        
        .file-label {
            display: block;
            background: #f3f4f6;
            border: 2px dashed #d1d5db;
            padding: 20px;
            border-radius: 15px;
            text-align: center;
            cursor: pointer;
            transition: 0.3s;
        }
        .file-label:hover { border-color: #6366f1; background: #eef2ff; }
        
        /* New Sync Loader */
        .loading-overlay {
            display: flex;
            position: fixed;
            inset: 0;
            background: rgba(15, 23, 42, 0.9);
            z-index: 100;
            color: white;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            backdrop-filter: blur(8px);
        }
    </style>
</head>
<body class="bg-slate-50 min-h-screen p-4 md:p-8 font-sans">

    <div id="loader" class="loading-overlay" style="display: none;">
        <div class="w-12 h-12 border-4 border-indigo-500 border-t-transparent rounded-full animate-spin mb-4"></div>
        <p class="font-bold tracking-widest uppercase text-xs">Syncing Studio Assets...</p>
    </div>

    <div class="max-w-6xl mx-auto bg-white rounded-[2rem] shadow-2xl overflow-hidden border border-gray-100">
        <div class="bg-slate-900 p-8 text-white flex justify-between items-center">
            <div>
                <h1 class="text-3xl font-black italic tracking-tighter uppercase">Studio Admin</h1>
                <p class="opacity-50 text-xs uppercase tracking-widest">Upload Assets & Configure Flow</p>
            </div>
            <button onclick="location.href='index.html'" class="bg-white/10 hover:bg-white/20 p-3 rounded-full transition">✕</button>
        </div>

        <div class="p-8 grid grid-cols-1 lg:grid-cols-3 gap-10">
            
            <div class="space-y-6">
                <h3 class="text-xs font-bold text-slate-400 uppercase tracking-widest border-b pb-2">1. Visuals</h3>
                <div class="flex flex-col items-center">
                    <label class="text-xs mb-2 text-slate-500 uppercase">Theme Color</label>
                    <input type="color" id="color-circle" oninput="updatePreviewColor(this.value)">
                    <span id="hex-code" class="mt-2 font-mono text-sm">#000000</span>
                </div>

                <div>
                    <label class="text-xs text-slate-500 block mb-2 uppercase font-bold">Custom Background Image</label>
                    <label class="file-label">
                        <span id="bg-status" class="text-xs text-slate-400 italic">Click to Upload BG</span>
                        <input type="file" id="bg-upload" class="hidden" accept="image/*" onchange="handleFileUpload(this, 'bgImg', 'bg-status')">
                    </label>
                </div>
            </div>

            <div class="space-y-6">
                <h3 class="text-xs font-bold text-slate-400 uppercase tracking-widest border-b pb-2">2. Media Files</h3>
                
                <div>
                    <label class="text-xs text-slate-500 block mb-2 uppercase font-bold">Background Music (MP3)</label>
                    <label class="file-label">
                        <span id="music-status" class="text-xs text-slate-400">Attach MP3 File</span>
                        <input type="file" id="music-upload" class="hidden" accept="audio/*" onchange="handleFileUpload(this, 'bgMusic', 'music-status')">
                    </label>
                </div>

                <div>
                    <label class="text-xs text-slate-500 block mb-2 uppercase font-bold text-indigo-500">Floating Popup Video (MP4)</label>
                    <label class="file-label border-indigo-200">
                        <span id="popup-status" class="text-xs text-slate-400">Attach MP4 File</span>
                        <input type="file" id="popup-upload" class="hidden" accept="video/*" onchange="handleFileUpload(this, 'popupVid', 'popup-status')">
                    </label>
                </div>

                <div>
                    <label class="text-xs text-red-500 font-bold block mb-2 uppercase">Jumpscare Media (MP4)</label>
                    <label class="file-label border-red-200 bg-red-50">
                        <span id="jump-status" class="text-xs text-red-400">Attach Scare File</span>
                        <input type="file" id="jump-upload" class="hidden" accept="video/*,audio/*" onchange="handleFileUpload(this, 'jumpMedia', 'jump-status')">
                    </label>
                </div>
            </div>

            <div class="space-y-6">
                <h3 class="text-xs font-bold text-slate-400 uppercase tracking-widest border-b pb-2">3. Page Order</h3>
                <ul id="page-list" class="space-y-2">
                    <li class="p-3 bg-slate-50 border rounded-xl flex justify-between items-center text-sm cursor-move shadow-sm" data-id="index.html">🏠 Home <span>⠿</span></li>
                    <li class="p-3 bg-slate-50 border rounded-xl flex justify-between items-center text-sm cursor-move shadow-sm" data-id="game.html">🎮 Pixel Game <span>⠿</span></li>
                    <li class="p-3 bg-slate-50 border rounded-xl flex justify-between items-center text-sm cursor-move shadow-sm" data-id="wish.html">🎂 Wish <span>⠿</span></li>
                    <li class="p-3 bg-slate-50 border rounded-xl flex justify-between items-center text-sm cursor-move shadow-sm" data-id="jumpscare.html">💀 Jumpscare <span>⠿</span></li>
                    <li class="p-3 bg-slate-50 border rounded-xl flex justify-between items-center text-sm cursor-move shadow-sm" data-id="gallery.html">📸 Gallery <span>⠿</span></li>
                </ul>
                
                <div class="pt-4">
                    <label class="text-xs text-slate-500 block mb-2 uppercase font-bold">Countdown Date</label>
                    <input type="datetime-local" id="conf-date" class="w-full border p-4 rounded-xl bg-slate-50 text-sm outline-none">
                </div>
            </div>
        </div>

        <div class="p-8 bg-slate-900 border-t flex justify-between items-center">
            <button onclick="localStorage.clear(); sessionStorage.clear(); location.reload();" class="text-white/30 hover:text-white text-xs underline">Wipe All Storage</button>
            <button onclick="saveEverything()" class="bg-indigo-500 text-white px-14 py-5 rounded-2xl font-black shadow-xl hover:scale-105 active:scale-95 transition-all uppercase tracking-tight">SAVE & PUBLISH</button>
        </div>
    </div>

    <script>
        const API_URL = '/.netlify/functions/update-config';
        let configData = {};

        // Password Check (Original logic)
        if(sessionStorage.getItem('adminActive') !== 'true') {
            if(prompt("Enter Admin Pass:") === "pheonix14") sessionStorage.setItem('adminActive', 'true');
            else window.location.href = "index.html";
        }

        // Sortable Setup (Original logic)
        const el = document.getElementById('page-list');
        Sortable.create(el, { animation: 150 });

        function updatePreviewColor(val) {
            document.getElementById('hex-code').innerText = val.toUpperCase();
        }

        // File Handler (Kept your logic, but stores in configData for sync)
        function handleFileUpload(input, storageKey, statusId) {
            const file = input.files[0];
            if (!file) return;

            document.getElementById(statusId).innerText = "⏳ Processing " + file.name + "...";
            
            const reader = new FileReader();
            reader.onload = function(e) {
                configData[storageKey] = e.target.result;
                // Also save to local for fallback
                localStorage.setItem(storageKey, e.target.result);
                document.getElementById(statusId).innerHTML = `<span style="color:#10b981">✅ Ready: ${file.name}</span>`;
            };
            reader.readAsDataURL(file);
        }

        // Save Everything (Now talks to Netlify Functions)
        async function saveEverything() {
            document.getElementById('loader').style.display = 'flex';
            
            const order = Array.from(el.children).map(li => li.getAttribute('data-id'));
            const payload = {
                ...configData,
                pageOrder: order,
                themeColor: document.getElementById('color-circle').value,
                targetDate: document.getElementById('conf-date').value
            };

            try {
                const res = await fetch(API_URL, {
                    method: 'POST',
                    headers: { 
                        'Content-Type': 'application/json',
                        'Authorization': 'pheonix14' 
                    },
                    body: JSON.stringify(payload)
                });

                if (res.ok) {
                    alert("Site Published Successfully!");
                } else {
                    const err = await res.text();
                    alert("Sync Error: " + err);
                }
            } catch (err) {
                alert("Network Error: Make sure your Netlify function is deployed.");
            }
            document.getElementById('loader').style.display = 'none';
        }

        // Initial Load (Pull from Cloud)
        async function init() {
            document.getElementById('loader').style.display = 'flex';
            try {
                const res = await fetch(API_URL);
                const data = await res.json();
                
                if (data.themeColor) {
                    document.getElementById('color-circle').value = data.themeColor;
                    document.getElementById('hex-code').innerText = data.themeColor.toUpperCase();
                }
                if (data.targetDate) document.getElementById('conf-date').value = data.targetDate;
                configData = data;
            } catch (e) {
                console.log("No remote config found, using local defaults.");
            }
            document.getElementById('loader').style.display = 'none';
        }
        init();
    </script>
</body>
</html>
