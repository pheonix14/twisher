<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Twisher • A Special Surprise Awaits!</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:ital,wght@0,400;0,700;0,900;1,900&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Plus Jakarta Sans', sans-serif;
            background: #0f172a;
        }
        .glow-effect {
            box-shadow: 0 0 50px -10px rgba(99, 102, 241, 0.35);
        }
        @keyframes pulseGlow {
            0%, 100% { transform: scale(1); opacity: 0.8; }
            50% { transform: scale(1.05); opacity: 1; }
        }
        .animate-pulse-slow {
            animation: pulseGlow 4s ease-in-out infinite;
        }
    </style>
</head>
<body class="min-h-screen flex flex-col items-center justify-center text-white text-center p-4 transition-all duration-1000 relative overflow-hidden">

    <!-- Ambient background light -->
    <div class="absolute -top-32 -left-32 w-96 h-96 bg-indigo-600/20 rounded-full blur-3xl pointer-events-none"></div>
    <div class="absolute -bottom-32 -right-32 w-96 h-96 bg-purple-600/20 rounded-full blur-3xl pointer-events-none"></div>

    <!-- Main Card -->
    <div class="relative z-10 p-8 md:p-14 bg-black/40 backdrop-blur-2xl rounded-[40px] md:rounded-[55px] border border-white/15 glow-effect max-w-lg w-full shadow-2xl transition-all">
        
        <!-- Recipient & Milestone Badge -->
        <div id="badge-container" class="inline-flex items-center gap-2 px-4 py-1.5 rounded-full bg-white/10 border border-white/15 text-xs font-semibold tracking-wider uppercase mb-6 text-indigo-300">
            <span></span>
            <span id="badge-text">Personal Surprise</span>
            <span id="age-badge" class="hidden px-2 py-0.5 rounded-full bg-indigo-500 text-white font-black text-[10px]">Turning <span id="badge-age"></span></span>
        </div>

        <h1 class="text-4xl md:text-6xl font-black mb-3 italic tracking-tight leading-tight">
            Hey <span id="name-display" class="bg-gradient-to-r from-indigo-300 via-pink-300 to-purple-300 bg-clip-text text-transparent">there!</span>
        </h1>

        <p id="from-note" class="text-white/60 text-sm md:text-base font-medium mb-8 max-w-xs mx-auto">
            Someone made a customized surprise experience just for you...
        </p>

        <!-- Countdown -->
        <div id="countdown-wrapper" class="mb-10">
            <p id="countdown-label" class="text-[11px] uppercase tracking-widest text-white/50 mb-3 font-bold">Unlocks In</p>
            <div class="flex gap-3 md:gap-4 justify-center text-3xl md:text-4xl font-mono">
                <div class="bg-white/10 border border-white/10 p-3 md:p-4 rounded-2xl min-w-[70px]">
                    <span id="d" class="font-black">00</span>
                    <p class="text-[9px] uppercase tracking-wider text-white/40 mt-1">Days</p>
                </div>
                <div class="bg-white/10 border border-white/10 p-3 md:p-4 rounded-2xl min-w-[70px]">
                    <span id="h" class="font-black">00</span>
                    <p class="text-[9px] uppercase tracking-wider text-white/40 mt-1">Hours</p>
                </div>
                <div class="bg-white/10 border border-white/10 p-3 md:p-4 rounded-2xl min-w-[70px]">
                    <span id="m" class="font-black">00</span>
                    <p class="text-[9px] uppercase tracking-wider text-white/40 mt-1">Mins</p>
                </div>
                <div class="bg-white/10 border border-white/10 p-3 md:p-4 rounded-2xl min-w-[70px]">
                    <span id="s" class="font-black">00</span>
                    <p class="text-[9px] uppercase tracking-wider text-white/40 mt-1">Secs</p>
                </div>
            </div>
            <p id="unlocked-msg" class="hidden text-emerald-400 font-bold text-lg mt-3 animate-bounce">
                 THE MOMENT HAS ARRIVED! 
            </p>
        </div>

        <!-- Start Button -->
        <button onclick="navigate('next')" class="w-full md:w-auto bg-white text-slate-900 px-12 py-5 rounded-full font-black text-base tracking-wide hover:scale-105 active:scale-95 transition-all shadow-[0_10px_30px_rgba(255,255,255,0.3)] hover:shadow-[0_15px_35px_rgba(255,255,255,0.4)]">
            START JOURNEY →
        </button>

        <!-- Credit in card -->
        <div class="mt-8 pt-6 border-t border-white/10 text-xs text-white/50 flex items-center justify-center gap-1.5 font-medium">
            <span>Powered by <span class="text-white font-bold">Twisher</span></span>
            <span>•</span>
            <span>Crafted by <a href="https://github.com/pheonix14" target="_blank" class="text-indigo-300 font-bold hover:underline">pheonix14</a></span>
        </div>
    </div>

    <!-- Admin Gear Button (preserves current URL parameters) -->
    <a id="admin-btn" href="admin.html" title="Studio Admin & Link Generator" class="fixed top-6 right-6 p-3.5 bg-black/40 hover:bg-black/70 border border-white/15 rounded-full transition-all text-lg shadow-xl hover:scale-110 active:scale-90 z-40 backdrop-blur-md">
        Settings
    </a>

    <!-- Engine Scripts -->
    <script src="engine.js"></script>
    <script>
        function applyIndexData() {
            const cfg = window.config || {};
            
            // Name personalization
            if (cfg.name && cfg.name !== "Bestie") {
                document.getElementById('name-display').innerText = cfg.name + "!";
                document.title = `Surprise for ${cfg.name} • Twisher`;
            } else if (cfg.name) {
                document.getElementById('name-display').innerText = cfg.name + "!";
            }

            // Age milestone badge
            if (cfg.age && cfg.age !== "Special") {
                const ageBadge = document.getElementById('age-badge');
                document.getElementById('badge-age').innerText = cfg.age;
                ageBadge.classList.remove('hidden');
            }

            // From note
            if (cfg.from) {
                document.getElementById('from-note').innerHTML = `A special journey curated with love by <strong class="text-white">${escapeHtml(cfg.from)}</strong>`;
            }

            // Target Countdown
            function updateTimer() {
                const targetStr = cfg.targetDate || cfg.date || '2026-12-31T00:00';
                const targetTime = new Date(targetStr).getTime();
                const now = new Date().getTime();
                const diff = targetTime - now;

                if (diff > 0) {
                    const days = Math.floor(diff / (1000 * 60 * 60 * 24));
                    const hours = Math.floor((diff % (1000 * 60 * 60 * 24)) / (1000 * 60 * 60));
                    const mins = Math.floor((diff % (1000 * 60 * 60)) / (1000 * 60));
                    const secs = Math.floor((diff % (1000 * 60)) / 1000);

                    document.getElementById('d').innerText = String(days).padStart(2, '0');
                    document.getElementById('h').innerText = String(hours).padStart(2, '0');
                    document.getElementById('m').innerText = String(mins).padStart(2, '0');
                    document.getElementById('s').innerText = String(secs).padStart(2, '0');
                } else {
                    document.getElementById('d').innerText = '00';
                    document.getElementById('h').innerText = '00';
                    document.getElementById('m').innerText = '00';
                    document.getElementById('s').innerText = '00';
                    document.getElementById('unlocked-msg').classList.remove('hidden');
                    document.getElementById('countdown-label').innerText = "Special Day";
                }
            }

            function escapeHtml(str) {
                return String(str).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;');
            }

            setInterval(updateTimer, 1000);
            updateTimer();
        }

        // Initialize when config is ready
        if (window.config) {
            applyIndexData();
        } else {
            window.addEventListener('load', applyIndexData);
        }
    </script>
</body>
</html>
<!-- Made by pheonix14 -->
