<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Memories Gallery • Twisher</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Dancing+Script:wght@700&family=Plus+Jakarta+Sans:wght@400;700;900&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Plus Jakarta Sans', sans-serif;
            background: #090d16;
        }
        .polaroid { 
            transition: all 0.35s cubic-bezier(0.175, 0.885, 0.32, 1.275); 
            box-shadow: 0 15px 35px rgba(0,0,0,0.5);
        }
        .polaroid:hover { 
            transform: scale(1.06) rotate(0deg) !important; 
            z-index: 20; 
            box-shadow: 0 25px 50px rgba(0,0,0,0.7);
        }
        .font-cursive { 
            font-family: 'Dancing Script', cursive; 
        }
    </style>
</head>
<body class="min-h-screen p-6 md:p-12 text-white transition-all duration-1000 relative">

    <!-- Header -->
    <header class="text-center mb-12">
        <div class="inline-block px-4 py-1 rounded-full bg-white/10 border border-white/15 text-xs uppercase font-bold tracking-widest text-indigo-300 mb-3">
             Snapshot Collection
        </div>
        <h1 id="gallery-header" class="text-4xl md:text-6xl font-black italic tracking-tighter">
            OUR MEMORIES
        </h1>
        <p id="gallery-sub" class="text-white/50 text-xs md:text-sm mt-2 max-w-md mx-auto">
            Cherished moments that make life truly extraordinary.
        </p>
    </header>

    <!-- Memories Grid -->
    <div id="grid" class="flex flex-wrap justify-center gap-8 md:gap-12 max-w-6xl mx-auto pb-16">
        <!-- Rendered dynamically via JavaScript -->
    </div>

    <!-- Navigation Action Bar -->
    <div class="mt-8 mb-16 flex flex-wrap justify-center items-center gap-4">
        <button onclick="navigate('prev')" class="px-8 py-4 rounded-full bg-white/10 border border-white/20 text-white hover:bg-white/20 transition font-bold text-xs uppercase tracking-wider">
            ← Previous
        </button>
        <button onclick="location.href='index.html' + window.location.search + window.location.hash" class="px-10 py-4 rounded-full bg-white text-slate-900 font-black hover:scale-105 active:scale-95 transition shadow-2xl text-sm">
            Restart Journey ↺
        </button>
        <a id="edit-memories-link" href="admin.html" class="px-6 py-4 rounded-full bg-indigo-600/80 hover:bg-indigo-600 text-white transition text-xs font-bold uppercase tracking-wider">
            Settings Edit in Studio
        </a>
    </div>

    <!-- UI Credit Section -->
    <footer class="text-center text-xs text-white/40 pb-10">
        <p>Twisher Memories Engine • Crafted by <a href="https://github.com/pheonix14" target="_blank" class="text-indigo-400 font-bold hover:underline">pheonix14</a></p>
    </footer>

    <!-- Engine Scripts -->
    <script src="engine.js"></script>
    <script>
        function renderMemories() {
            const cfg = window.config || {};
            
            // Personalize Title
            if (cfg.name && cfg.name !== "Bestie") {
                document.getElementById('gallery-header').innerText = `MEMORIES WITH ${cfg.name.toUpperCase()}`;
            }

            const memories = cfg.memories || [];
            const grid = document.getElementById('grid');

            if (memories.length === 0) {
                grid.innerHTML = `
                    <div class="text-center p-12 bg-white/5 rounded-3xl border border-white/10 max-w-md mx-auto">
                        <p class="text-4xl mb-4"></p>
                        <h3 class="text-xl font-bold mb-2">No Memories Added Yet</h3>
                        <p class="text-xs text-white/50 mb-6">Open Studio Admin to attach sweet photo moments to this surprise link!</p>
                        <a href="admin.html${window.location.search}${window.location.hash}" class="inline-block bg-white text-black px-6 py-3 rounded-full font-bold text-xs">
                            Add Photos Now →
                        </a>
                    </div>
                `;
                return;
            }

            const rotations = ['-2deg', '2deg', '-1deg', '3deg', '-3deg', '1.5deg'];

            grid.innerHTML = memories.map((m, i) => {
                const rot = rotations[i % rotations.length];
                const caption = m.caption || 'Unforgettable memory ';
                const imgSrc = m.src || 'https://placehold.co/600x450/1e293b/ffffff?text=Twisher+Memory';

                return `
                    <div class="polaroid bg-white text-slate-900 p-4 rounded-2xl w-72 md:w-80" style="transform: rotate(${rot});">
                        <div class="overflow-hidden bg-slate-100 rounded-xl mb-3 h-64 shadow-inner">
                            <img src="${imgSrc}" alt="Memory" class="w-full h-full object-cover hover:scale-105 transition duration-500" onerror="this.src='https://placehold.co/600x450/1e293b/ffffff?text=Image+Not+Found'">
                        </div>
                        <p class="font-cursive text-2xl text-center text-slate-800 py-2 leading-relaxed">
                            ${escapeHtml(caption)}
                        </p>
                    </div>
                `;
            }).join('');
        }

        function escapeHtml(str) {
            return String(str).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;');
        }

        window.addEventListener('load', renderMemories);
        if (window.config) renderMemories();
    </script>
</body>
</html>
<!-- Made by pheonix14 -->
