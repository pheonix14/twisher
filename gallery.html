<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Memories | Cloud Sync</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        .polaroid { transition: transform 0.3s ease; }
        .polaroid:hover { transform: scale(1.05) rotate(0deg) !important; z-index: 10; }
        .loader { border-top-color: #3498db; animation: spinner 1.5s linear infinite; }
        @keyframes spinner { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
    </style>
</head>
<body class="bg-slate-900 min-h-screen p-6 md:p-12 transition-all duration-1000">
    
    <h1 class="text-center text-5xl font-black text-white italic mb-12 tracking-tighter">OUR MEMORIES</h1>

    <div id="admin-zone" class="hidden max-w-xl mx-auto mb-16 p-8 bg-white rounded-[2.5rem] shadow-2xl">
        <h2 class="text-xs font-bold text-slate-400 uppercase tracking-widest mb-4">Admin: Add New Memory</h2>
        <input type="text" id="img-url" placeholder="Paste Image URL (Cloudinary/ImgBB)..." class="w-full border p-3 rounded-xl mb-3 text-sm focus:ring-2 focus:ring-blue-500 outline-none">
        <input type="text" id="cap" placeholder="Write a sweet caption..." class="w-full border p-3 rounded-xl mb-4 text-sm focus:ring-2 focus:ring-blue-500 outline-none">
        <button onclick="addMemory()" id="add-btn" class="w-full bg-indigo-600 hover:bg-indigo-700 text-white py-4 rounded-2xl font-black transition-all shadow-lg active:scale-95">UPLOAD TO CLOUD</button>
    </div>

    <div id="grid" class="flex flex-wrap justify-center gap-12">
        <div id="grid-loader" class="loader w-12 h-12 border-4 border-white/20 rounded-full mt-20"></div>
    </div>

    <div class="mt-20 flex justify-center gap-6">
        <button onclick="window.history.back()" class="px-10 py-4 rounded-full bg-white/5 border border-white/10 text-white hover:bg-white/10 transition">← Back</button>
        <button onclick="location.href='index.html'" class="px-12 py-4 rounded-full bg-white text-black font-black hover:scale-105 transition shadow-xl">Home →</button>
    </div>

    <script>
        const API_URL = '/.netlify/functions/manage-memories';
        const AUTH_TOKEN = sessionStorage.getItem('admin_token');
        const isAdmin = AUTH_TOKEN === 'pheonix14';

        // Show admin zone if logged in
        if(isAdmin) {
            document.getElementById('admin-zone').classList.remove('hidden');
        }

        // FETCH Memories from Neon
        async function render() {
            try {
                const res = await fetch(API_URL);
                const mems = await res.json();
                
                const grid = document.getElementById('grid');
                if (mems.length === 0) {
                    grid.innerHTML = `<p class="text-white/30 italic">No memories yet. Add some from the admin panel!</p>`;
                    return;
                }

                grid.innerHTML = mems.map((m, i) => `
                    <div class="polaroid bg-white p-4 shadow-2xl rotate-${i % 2 === 0 ? '2' : '-2'} w-72">
                        <div class="overflow-hidden bg-gray-100 mb-3">
                            <img src="${m.src}" class="w-full h-56 object-cover hover:scale-110 transition duration-700" onerror="this.src='https://placehold.co/400x300?text=Invalid+Link'">
                        </div>
                        <p class="text-center italic text-gray-700 font-serif text-lg py-2">${m.caption || '...'}</p>
                        ${isAdmin ? `<button onclick="deleteMemory(${m.id})" class="text-[10px] uppercase tracking-tighter text-red-400 font-bold block mx-auto mt-4 hover:text-red-600">Remove Photo</button>` : ''}
                    </div>
                `).join('');
            } catch (err) {
                document.getElementById('grid').innerHTML = `<p class="text-red-400">Error connecting to Neon database.</p>`;
            }
        }

        // ADD Memory to Neon
        async function addMemory() {
            const src = document.getElementById('img-url').value;
            const caption = document.getElementById('cap').value;
            const btn = document.getElementById('add-btn');

            if(!src) return alert("Please paste an image URL first!");

            btn.innerText = "SAVING...";
            btn.disabled = true;

            try {
                const res = await fetch(API_URL, {
                    method: 'POST',
                    headers: { 
                        'Content-Type': 'application/json',
                        'Authorization': AUTH_TOKEN 
                    },
                    body: JSON.stringify({ src, caption })
                });

                if(res.ok) {
                    document.getElementById('img-url').value = '';
                    document.getElementById('cap').value = '';
                    render();
                }
            } catch (err) {
                alert("Failed to save. Check Netlify logs.");
            } finally {
                btn.innerText = "UPLOAD TO CLOUD";
                btn.disabled = false;
            }
        }

        // DELETE Memory from Neon
        async function deleteMemory(id) {
            if(!confirm("Delete this memory forever?")) return;

            await fetch(API_URL, {
                method: 'DELETE',
                headers: { 
                    'Content-Type': 'application/json',
                    'Authorization': AUTH_TOKEN 
                },
                body: JSON.stringify({ id })
            });
            render();
        }

        render();
    </script>
</body>
</html>
