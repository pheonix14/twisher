<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Moments & Surprises • Twisher</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Dancing+Script:wght@700&family=Inter:wght@400;900&display=swap" rel="stylesheet">
    <style>
        body { 
            background: radial-gradient(circle at center, #1e293b 0%, #0f172a 100%);
            font-family: 'Inter', sans-serif;
        }

        @keyframes entrance {
            from { opacity: 0; transform: translateY(40px) scale(0.9); filter: blur(8px); }
            to { opacity: 1; transform: translateY(0) scale(1) rotate(var(--rot)); filter: blur(0); }
        }

        .memory-card {
            animation: entrance 0.8s cubic-bezier(0.22, 1, 0.36, 1) forwards;
            opacity: 0;
            --rot: 0deg;
        }

        .anim-float { animation: entrance 0.8s forwards, drift 4s ease-in-out infinite alternate; }
        @keyframes drift {
            from { transform: translateY(0) rotate(var(--rot)); }
            to { transform: translateY(-12px) rotate(calc(var(--rot) + 1.5deg)); }
        }

        .polaroid-frame {
            box-shadow: 0 20px 45px rgba(0,0,0,0.5);
            transition: all 0.35s ease;
        }

        .polaroid-frame:hover {
            transform: scale(1.08) rotate(0deg) !important;
            z-index: 50;
            box-shadow: 0 30px 60px rgba(0,0,0,0.7);
        }
    </style>
</head>
<body class="min-h-screen p-6 md:p-12 text-white overflow-x-hidden relative">

    <div class="max-w-6xl mx-auto">
        <header class="text-center mb-16 space-y-3">
            <h1 id="gallery-title" class="text-5xl md:text-7xl font-black italic tracking-tighter">
                Our Moments
            </h1>
            <p id="gallery-author" class="text-white/40 uppercase tracking-[0.25em] text-xs font-bold">
                Special Moments & Surprises
            </p>
        </header>

        <div id="memory-container" class="flex flex-wrap gap-10 justify-center pb-24">
            <!-- Dynamic memories -->
        </div>

        <div class="flex justify-center gap-4 pb-16">
            <button onclick="navigate('prev')" class="px-8 py-3.5 rounded-full bg-white/10 hover:bg-white/20 text-white font-bold text-xs uppercase tracking-wider transition">
                ← Back
            </button>
            <button onclick="navigate('next')" class="px-10 py-3.5 rounded-full bg-white text-slate-900 font-black text-xs uppercase tracking-wider hover:scale-105 active:scale-95 transition shadow-xl">
                Continue →
            </button>
        </div>

        <footer class="text-center text-xs text-white/40 pb-8 border-t border-white/10 pt-6">
            <p>Twisher • Designed by <a href="https://github.com/pheonix14" target="_blank" class="text-indigo-400 font-bold hover:underline">pheonix14</a></p>
        </footer>
    </div>

    <!-- Engine Scripts -->
    <script src="engine.js"></script>
    <script>
        function renderGallery() {
            const cfg = window.config || {};
            const container = document.getElementById('memory-container');

            const title = document.getElementById('gallery-title');
            if (cfg.name && cfg.name !== "Bestie") {
                title.innerText = `Moments with ${cfg.name}`;
            }

            const memories = cfg.memories || [];
            
            if (memories.length === 0) {
                container.innerHTML = `<p class="text-white/40 italic">No memories attached to this link yet.</p>`;
                return;
            }

            container.innerHTML = memories.map((m, i) => {
                const rotation = (Math.random() * 6 - 3).toFixed(2); 
                return `
                    <div class="memory-card anim-float polaroid-frame bg-white p-4 pb-6 rounded-2xl" 
                         style="animation-delay: ${i * 0.12}s; --rot: ${rotation}deg;">
                        <div class="w-64 h-64 overflow-hidden rounded-xl bg-slate-100 mb-4">
                            <img src="${m.src}" alt="Moment" class="w-full h-full object-cover">
                        </div>
                        <p class="text-slate-800 font-bold italic text-center text-xl font-serif" 
                           style="font-family: 'Dancing Script', cursive;">
                           ${escapeHtml(m.caption || 'Cherished moment')}
                        </p>
                    </div>
                `;
            }).join('');
        }

        function escapeHtml(str) {
            return String(str).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;');
        }

        window.addEventListener('load', renderGallery);
        if (window.config) renderGallery();
    </script>
</body>
</html>
<!-- Made by pheonix14 -->
