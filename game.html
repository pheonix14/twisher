<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Wish.jar</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap');

        body { 
            background-color: #1a1a1a; 
            color: #fff; 
            font-family: 'Press Start 2P', cursive;
            image-rendering: pixelated;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
            margin: 0;
            overflow: hidden;
        }

        /* Retro Handheld Screen Container */
        .handheld-screen {
            width: 280px;
            height: 280px;
            background: #000;
            border: 10px solid #333;
            border-radius: 4px;
            position: relative;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            box-shadow: inset 0 0 20px rgba(0,255,0,0.1);
        }

        /* Scanline Overlay Effect */
        .handheld-screen::after {
            content: "";
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            background: linear-gradient(rgba(18, 16, 16, 0) 50%, rgba(0, 0, 0, 0.25) 50%), 
                        linear-gradient(90deg, rgba(255, 0, 0, 0.06), rgba(0, 255, 0, 0.02), rgba(0, 0, 255, 0.06));
            background-size: 100% 4px, 3px 100%;
            pointer-events: none;
        }

        /* Pixel Cake Components */
        .cake-container { cursor: pointer; transform: scale(1.5); }

        #candle {
            width: 6px; height: 16px;
            background: #fff;
            margin: 0 auto;
            position: relative;
        }

        #flame {
            width: 6px; height: 6px;
            background: #ffae00; /* Retro Orange */
            position: absolute;
            top: -8px; left: 0;
            display: none;
            box-shadow: 0 0 5px #ffae00;
            animation: flicker 0.1s steps(2) infinite;
        }

        .cake-body {
            width: 48px; height: 32px;
            border: 4px solid #fff;
            background: #000;
            position: relative;
        }

        .cake-detail {
            position: absolute;
            top: 8px; left: 0;
            width: 100%; height: 4px;
            background: #fff;
        }

        @keyframes flicker {
            0% { transform: translate(1px, 0); opacity: 1; }
            100% { transform: translate(-1px, -1px); opacity: 0.8; }
        }

        /* Retro Buttons (A / B Style) */
        .controls {
            margin-top: 40px;
            display: flex;
            gap: 40px;
        }

        .btn-round {
            width: 50px; height: 50px;
            border-radius: 50%;
            background: #8b0000;
            border: 4px solid #4a0000;
            color: rgba(255,255,255,0.5);
            font-size: 10px;
            display: flex;
            align-items: center;
            justify-content: center;
            box-shadow: 0 4px 0 #333;
            cursor: pointer;
        }

        .btn-round:active { transform: translateY(2px); box-shadow: 0 2px 0 #333; }
        .btn-round:disabled { filter: grayscale(1); cursor: not-allowed; opacity: 0.3; }

        #tap-msg {
            font-size: 8px;
            color: #0f0; /* Matrix Green */
            margin-top: 30px;
            letter-spacing: 2px;
            animation: blink 0.8s steps(2) infinite;
        }

        @keyframes blink { to { opacity: 0; } }
    </style>
</head>
<body>

    <div class="handheld-screen">
        <div class="cake-container" onclick="ignite()">
            <div id="candle"><div id="flame"></div></div>
            <div class="cake-body"><div class="cake-detail"></div></div>
        </div>
        <p id="tap-msg">TAP IT</p>
    </div>

    <div class="controls">
        <div class="flex flex-col items-center gap-2">
            <button onclick="navigate('prev')" class="btn-round">B</button>
            <span class="text-[8px] opacity-40">EXIT</span>
        </div>
        <div class="flex flex-col items-center gap-2">
            <button onclick="navigate('next')" id="next-btn" class="btn-round" disabled>A</button>
            <span class="text-[8px] opacity-40">NEXT</span>
        </div>
    </div>

    <script src="engine.js"></script>
    <script>
        function ignite() {
            const flame = document.getElementById('flame');
            const msg = document.getElementById('tap-msg');
            const nextBtn = document.getElementById('next-btn');

            flame.style.display = 'block';
            msg.style.color = '#fff';
            msg.innerText = "DONE!";
            msg.style.animation = "none";
            
            // Enable A Button
            nextBtn.disabled = false;
            nextBtn.style.background = "#008000"; // Turn Green
            nextBtn.style.borderColor = "#004d00";

            if (navigator.vibrate) navigator.vibrate(40);
        }
    </script>
</body>
</html>
