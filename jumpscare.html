<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>...</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-black min-h-screen flex items-center justify-center overflow-hidden">
    <div id="scare-wrap" class="fixed inset-0 hidden">
        <video id="v" class="w-full h-full object-cover" playsinline></video>
    </div>
    <script>
        const data = localStorage.getItem('jumpMedia');
        setTimeout(() => {
            if(!data) { window.location.href="index.html"; return; }
            document.getElementById('scare-wrap').classList.remove('hidden');
            const v = document.getElementById('v');
            v.src = data;
            v.play();
            // Go to gallery after 4 seconds
            setTimeout(() => window.location.href="gallery.html", 4000);
        }, 2000);
    </script>
</body>
</html>
